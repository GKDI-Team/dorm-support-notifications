spring:
  application:
    name: notifications-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:notifications_db}
    username: ${DB_USER:dormsupport}
    password: ${DB_PASSWORD:dormsupport}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:dormsupport-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

events:
  issue-topic: ${ISSUE_EVENTS_TOPIC:dormsupport.issue-events}

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
